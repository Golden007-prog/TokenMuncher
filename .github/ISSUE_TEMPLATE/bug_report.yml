name: Bug report
description: Something does not work or shows wrong numbers
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Do not paste tokens, credential files, or screenshots with data you want to keep private.
        For a security problem, use the private report instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you know how to make it happen again.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: "In the app: Settings → about → [ copy diagnostics ], then paste here. It has versions, settings and counts; no logins, tokens, conversation text or project names."
      render: markdown
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: A screenshot helps when the problem is visual.
